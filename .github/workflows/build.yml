name: Build Astral Knight HD (180 FPS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Custom Font
        run: |
          mkdir assets\fonts -Force
          curl -L -f --retry 3 "https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf" -o assets\fonts\AstralFont.ttf || echo "Fallback to system font"

      - name: Generate 2K Textures, HD Sprites & Stereo Audio
        run: |
          python build_assets.py

      - name: Build Windows App with PyInstaller
        run: |
          pyinstaller --onedir --noconsole --noupx --name "AstralKnight" --add-data "assets;assets" main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstralKnight-HD-Windows
          path: dist/AstralKnight
